name: Validate map submission

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force
          gh label create invalid --repo "$GH_REPO" --color B60205 --description "Submission failed validation" --force

      - name: Validate issue form fields
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          valid=true
          grep -q 'I am submitting through the SC2CommunityMaps form v1\.' <<< "$BODY" || valid=false
          for marker in '### Map name' '### Author' '### Download URL' '### File type' '### Map or mappack version' '### Scenario File Path'; do
            grep -q "$marker" <<< "$BODY" || valid=false
          done
          url=$(awk '/^### Download URL/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r')
          [[ "$url" == https://* ]] || valid=false
          [[ "$url" == *.scd || "$url" == *.zip ]] || valid=false
          version=$(awk '/^### Map or mappack version/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || valid=false
          scenario=$(awk '/^### Scenario File Path/{flag=1; next} /^### /{flag=0} flag' <<< "$BODY" | tr '\r\n' ' ' | xargs)
          [[ -n "$scenario" ]] || valid=false
          for scenario_path in $scenario; do [[ "$scenario_path" == *.lua ]] || valid=false; done
          if [[ "$valid" == true ]]; then
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label pending --remove-label invalid
          else
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label invalid --remove-label pending
            exit 0
          fi

      - name: Compute SHA-256 automatically
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(awk '/^### Download URL/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r')
          temp=$(mktemp)
          body_file=$(mktemp)
          trap 'rm -f "$temp" "$body_file"' EXIT

          curl --fail --location --max-time 120 --proto '=https' --proto-redir '=https' --output "$temp" "$url"
          size=$(stat -c '%s' "$temp")
          if (( size > 536870912 )); then
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label invalid --remove-label pending
            exit 0
          fi

          hash=$(sha256sum "$temp" | awk '{print toupper($1)}')
          gh issue view "$NUMBER" --repo "$GH_REPO" --json body --jq .body > "$body_file"
          HASH="$hash" perl -0pi -e 's/(### SHA-256 \(generated automatically\)\s*)(?:_No response_|[^\s]+)?/$1.$ENV{HASH}/e' "$body_file"
          gh issue edit "$NUMBER" --repo "$GH_REPO" --body-file "$body_file"
