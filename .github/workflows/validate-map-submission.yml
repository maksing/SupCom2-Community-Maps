name: Validate map submission

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

# One run per issue at a time, so label changes from two edits never interleave.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validation scripts
        uses: actions/checkout@v4

      - name: Ensure workflow labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force
          gh label create invalid --repo "$GH_REPO" --color B60205 --description "Submission failed validation" --force

      - name: Validate the submission
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: bash .github/scripts/on_submission.sh
