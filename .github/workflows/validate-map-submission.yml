name: Validate map submission

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force
          gh label create invalid --repo "$GH_REPO" --color B60205 --description "Submission failed validation" --force

      - name: Validate issue form fields
        id: validate
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          section() {
            awk -v h="### $1" '{ sub(/\r$/, "") } $0 == h { f = 1; next } /^### / { f = 0 } f' <<< "$BODY" | sed '/^[[:space:]]*$/d'
          }
          errors=()
          for marker in 'Map name' 'Author' 'Download URL' 'Map or mappack version' 'Scenario File Paths'; do
            value=$(section "$marker")
            [[ -n "$value" && "$value" != "_No response_" ]] || errors+=("**$marker** is required.")
          done
          url=$(section 'Download URL' | head -n 1 | tr -d ' ')
          if [[ -n "$url" ]]; then
            [[ "$url" == https://* ]] || errors+=("**Download URL** must be a direct HTTPS link.")
            [[ "$url" == *.scd || "$url" == *.zip ]] || errors+=("**Download URL** must end with \`.scd\` or \`.zip\`.")
          fi
          version=$(section 'Map or mappack version' | head -n 1 | tr -d ' ')
          if [[ -n "$version" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || errors+=("**Map or mappack version** must be exactly three numbers such as \`1.0.0\`.")
          fi
          while IFS= read -r scenario_path; do
            scenario_path=$(tr -d ' ' <<< "$scenario_path")
            [[ -z "$scenario_path" || "$scenario_path" == "_No response_" ]] && continue
            [[ "$scenario_path" == *.lua ]] || errors+=("Every **Scenario File Path** must end with \`.lua\`; fix the path starting with \`${scenario_path:0:80}\`.")
          done < <(section 'Scenario File Paths' | tr ';' '\n')
          if (( ${#errors[@]} == 0 )); then
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label pending --remove-label invalid
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label invalid --remove-label pending
            message="The automatic check found problems with this submission:"$'\n\n'
            for error in "${errors[@]}"; do message+="- $error"$'\n'; done
            message+=$'\n'"Edit the issue to fix them and it will be checked again."
            gh issue comment "$NUMBER" --repo "$GH_REPO" --body "$message"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute SHA-256 automatically
        if: steps.validate.outputs.valid == 'true'
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(awk '/^### Download URL/{getline; getline; print; exit}' <<< "$BODY" | tr -d '\r')
          temp=$(mktemp)
          body_file=$(mktemp)
          trap 'rm -f "$temp" "$body_file"' EXIT

          reject() {
            gh issue edit "$NUMBER" --repo "$GH_REPO" --add-label invalid --remove-label pending
            gh issue comment "$NUMBER" --repo "$GH_REPO" --body "$1 Edit the issue to fix it and it will be checked again."
            exit 0
          }

          curl --fail --location --max-time 120 --proto '=https' --proto-redir '=https' --output "$temp" "$url" || reject "The download URL could not be downloaded. Make sure it is a direct HTTPS link that works without signing in."
          size=$(stat -c '%s' "$temp")
          if (( size > 536870912 )); then
            reject "The file is larger than the 512 MB limit."
          fi

          hash=$(sha256sum "$temp" | awk '{print toupper($1)}')
          gh issue view "$NUMBER" --repo "$GH_REPO" --json body --jq .body > "$body_file"
          HASH="$hash" perl -0pi -e 's/(### SHA-256 \(generated automatically\)\s*)(?:_No response_|[^\s]+)?/$1.$ENV{HASH}/e' "$body_file"
          gh issue edit "$NUMBER" --repo "$GH_REPO" --body-file "$body_file"
