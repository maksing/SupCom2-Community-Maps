name: Validate verified map

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.label.name == 'verified'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validation scripts
        uses: actions/checkout@v4

      - name: Ensure moderation labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force
          gh label create invalid --repo "$GH_REPO" --color B60205 --description "Submission failed validation" --force

      - name: Validate verified issue
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -uo pipefail
          errors=$(python3 .github/scripts/validate_submission.py fields)
          sha=$(python3 .github/scripts/validate_submission.py sha)
          [[ "$sha" =~ ^[0-9A-Fa-f]{64}$ ]] || errors+=$'\n'"The SHA-256 was not generated; wait for the automatic check to finish, or edit the issue to run it again."
          errors=$(sed '/^[[:space:]]*$/d' <<< "$errors")
          if [[ -z "$errors" ]]; then
            exit 0
          fi
          message="The verified label was removed because the submission has problems:"$'\n\n'
          while IFS= read -r line; do message+="- $line"$'\n'; done <<< "$errors"
          gh issue edit "$NUMBER" --repo "$GH_REPO" --remove-label verified --add-label pending --add-label invalid
          gh issue comment "$NUMBER" --repo "$GH_REPO" --body "$message"
