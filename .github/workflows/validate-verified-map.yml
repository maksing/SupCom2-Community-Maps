name: Validate verified map

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.label.name == 'verified'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validation scripts
        uses: actions/checkout@v4

      - name: Ensure moderation labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force
          gh label create invalid --repo "$GH_REPO" --color B60205 --description "Submission failed validation" --force

      - name: Validate verified issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Read the body now, not from the event: it may have been edited since the label was added.
          BODY=$(gh issue view "$NUMBER" --repo "$GH_REPO" --json body --jq .body)
          export BODY
          bash .github/scripts/on_verified.sh
