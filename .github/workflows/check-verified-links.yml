name: Check verified maps

# Re-downloads every verified map once a week. A map whose download no longer works is labeled broken,
# and a map whose file changed after it was verified goes back to pending for another review.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the validation scripts
        uses: actions/checkout@v4

      - name: Ensure labels exist
        run: |
          gh label create broken --repo "$GH_REPO" --color D93F0B --description "Map or download link does not work" --force
          gh label create pending --repo "$GH_REPO" --color FBCA04 --description "Awaiting moderator review" --force

      - name: Re-download verified maps
        shell: bash
        run: |
          set -uo pipefail
          gh issue list --repo "$GH_REPO" --state open --label verified --limit 500 --json number --jq '.[].number' > numbers.txt
          temp=$(mktemp)
          trap 'rm -f "$temp" numbers.txt' EXIT
          while read -r number; do
            export NUMBER="$number"
            export BODY
            BODY=$(gh issue view "$number" --repo "$GH_REPO" --json body --jq .body)
            url=$(python3 .github/scripts/validate_submission.py url)
            expected=$(python3 .github/scripts/validate_submission.py sha | tr 'a-f' 'A-F')
            [[ -n "$url" ]] || continue

            if ! curl --silent --show-error --fail --location --max-time 300 --max-filesize 536870912 \
                 --proto '=https' --proto-redir '=https' --output "$temp" "$url"; then
              echo "#$number: download failed"
              gh issue edit "$number" --repo "$GH_REPO" --remove-label verified --add-label broken
              gh issue comment "$number" --repo "$GH_REPO" --body "The weekly check could not download this map, so the verified label was removed and the issue was labeled broken. Fix the download URL (edit the issue) and a moderator can verify it again."
              continue
            fi

            actual=$(sha256sum "$temp" | awk '{print toupper($1)}')
            if [[ -n "$expected" && "$actual" != "$expected" ]]; then
              echo "#$number: file changed"
              gh issue edit "$number" --repo "$GH_REPO" --remove-label verified --add-label pending
              gh issue comment "$number" --repo "$GH_REPO" --body "The weekly check found that the file behind the download URL changed after this map was verified (SHA-256 was \`$expected\`, now \`$actual\`). The verified label was removed; edit the issue to submit the new file and a moderator will review it again."
            else
              echo "#$number: ok"
            fi
          done < numbers.txt
