name: Publish map
description: Submit a Supreme Commander 2 map for community review
title: "[MAP] "
labels:
  - pending
body:
  - type: checkboxes
    id: form_version
    attributes:
      label: Form version
      options:
        - label: I am submitting through the SC2CommunityMaps form v1.
          required: true
  - type: input
    id: map_name
    attributes:
      label: Map name
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: true
  - type: input
    id: download_url
    attributes:
      label: Download URL
      description: Direct HTTPS URL to an .scd or .zip file.
    validations:
      required: true
  - type: dropdown
    id: file_type
    attributes:
      label: File type
      options:
        - .scd
        - .zip
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Map or mappack version
      description: Use exactly three numbers: 1.17.2, 1.0.0, or 2.0.0.
    validations:
      required: true
  - type: input
    id: scenario_file_paths
    attributes:
      label: Scenario File Paths
      description: Required. Enter one or more paths inside the archive separated by semicolons. Every path must end with .lua.
      placeholder: /maps/example/example_scenario.lua;/maps/example/example_preview.lua
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional description shown in the launcher.
  - type: input
    id: players
    attributes:
      label: Players
      description: Optional. Match the official catalog format, for example 2 Players or 2v2.
  - type: input
    id: style
    attributes:
      label: Style
      description: Optional map/team style, for example FFA or Team.
  - type: input
    id: size
    attributes:
      label: Size
      description: Optional map size, for example Small, Medium, or Large.
  - type: textarea
    id: map_image
    attributes:
      label: Map image
      description: Optional map preview image. Drag an image here or paste it into this field while filling out the form.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional comma-separated tags used by the official catalog.
  - type: input
    id: sha256
    attributes:
      label: SHA-256 (generated automatically)
      description: Leave this field unchanged. The repository workflow fills it after submission.
  - type: checkboxes
    id: agreement
    attributes:
      label: Publication agreement
      options:
        - label: I have the right to publish this map and understand that pending maps are unverified.
          required: true
