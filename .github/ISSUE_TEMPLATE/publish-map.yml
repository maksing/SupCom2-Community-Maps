name: Publish map
description: Submit a Supreme Commander 2 map for community review
title: "[MAP] "
labels:
  - pending
body:
  - type: markdown
    attributes:
      value: |
        Before you submit:
        - The download must be a **direct HTTPS link** to an `.scd` or `.zip` file, for example a GitHub Releases asset. Pages on Google Drive, Mega, or similar hosts will not work.
        - Pending maps are unverified. A maintainer reviews each submission before it is marked verified.
        - Do not edit the generated SHA-256 field; an automatic check fills it in after you submit.
        - If the automatic check finds a problem, it leaves a comment on your issue explaining what to fix. Edit the issue and it is checked again.

        Full publishing rules are in the [README](https://github.com/maksing/SupCom2-Community-Maps#readme).
  - type: checkboxes
    id: form_version
    attributes:
      label: Form version
      options:
        - label: I am submitting through the SC2CommunityMaps form v1.
          required: true
  - type: input
    id: map_name
    attributes:
      label: Map name
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
    validations:
      required: true
  - type: input
    id: download_url
    attributes:
      label: Download URL
      description: Direct HTTPS URL to an .scd or .zip file.
      placeholder: https://github.com/user/repo/releases/download/v1.0.0/map.scd
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Map or mappack version
      description: "Use exactly three numbers, for example 1.17.2, 1.0.0, or 2.0.0."
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: scenario_file_paths
    attributes:
      label: Scenario File Paths
      description: Required. Enter one path inside the archive per line. Every path must end with .lua.
      placeholder: |
        /maps/example/example_scenario.lua
        /maps/example/example_second_scenario.lua
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional description shown in the launcher.
  - type: dropdown
    id: players
    attributes:
      label: Players
      description: Optional. Number of players the map supports.
      options:
        - Unknown
        - 1 Player
        - 2 Players
        - 3 Players
        - 4 Players
        - 5 Players
        - 6 Players
        - 7 Players
        - 8 Players
      default: 0
  - type: dropdown
    id: style
    attributes:
      label: Style
      description: Optional. Select every team layout the map supports, for example 4v4 and 2v2.
      multiple: true
      options:
        - FFA
        - 1v1
        - 2v2
        - 3v3
        - 4v4
        - 1v7
        - 3v3v2
        - 1vAI
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Optional map size.
      options:
        - Unknown
        - Small
        - Medium
        - Large
      default: 0
  - type: textarea
    id: map_image
    attributes:
      label: Map image
      description: Optional map preview image. Drag an image here or paste it into this field while filling out the form.
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Optional. Select every tag that applies, the same tags the official catalog uses. For a map pack, select all player counts and sizes it contains.
      multiple: true
      options:
        - 2 Players
        - 4 Players
        - 6 Players
        - 7 Players
        - 8 Players
        - FFA
        - Team
        - Small
        - Medium
        - Large
        - Water
        - Map Pack
  - type: input
    id: sha256
    attributes:
      label: SHA-256 (generated automatically)
      description: Leave this field unchanged. The repository workflow fills it after submission.
  - type: checkboxes
    id: agreement
    attributes:
      label: Publication agreement
      options:
        - label: I have the right to publish this map and understand that pending maps are unverified.
          required: true
